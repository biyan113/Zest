name: Zest
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
options:
  bundleIdPrefix: app.zest
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - en
    - Base
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: zh-Hans
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH[config=Debug]: YES
    ONLY_ACTIVE_ARCH[config=Release]: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    SWIFT_OPTIMIZATION_LEVEL[config=Release]: "-O"
    DEPLOYMENT_POSTPROCESSING[config=Release]: YES
    STRIP_INSTALLED_PRODUCT[config=Release]: YES
    STRIP_STYLE[config=Release]: non-global
    DEBUG_INFORMATION_FORMAT[config=Release]: dwarf-with-dsym
targets:
  Zest:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zest.monitor
        PRODUCT_NAME: Zest
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Zest.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/SMC/Zest-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: Sparkle
        product: Sparkle
  ZestTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Zest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zest.monitor.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Zest.app/Contents/MacOS/Zest"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Zest:
    build:
      targets:
        Zest: all
        ZestTests: [test]
    test:
      targets:
        - ZestTests
      gatherCoverageData: false
